# Builder — a system agent that makes safe, conventional changes to a dispatching
# agent's workspace repo on request, opens a PR, and reports back via callback.
#
# Runs as its own Agency daemon. Inbound dispatches arrive at
# POST /webhooks/system/builder (bearer-authed). The triage rule runs first and
# decomposes the request into one or more surface-specific work items
# (workspace, tool, runtime). Triage emits those work items via internal-events
# POSTs that route to the matching specialized template.

providers:
  - name: builder-dispatch
    routePath: /webhooks/system/builder
    signatureStrategy: bearer
    hmacSecretKey: BUILDER_DISPATCH_TOKEN
    # Builder authenticates to GitHub as an App: the app_token minter reads these
    # from the run env and mints a short-lived, repo-scoped install token per run.
    envSecrets: [GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY]

  # Internal-events route for triage's downstream dispatches. Triage POSTs back
  # to this route on its own daemon with kind=workspace_task / tool_task /
  # runtime_task; the routing rules below pick the specialized template per kind.
  - name: builder-internal-events
    routePath: /hooks/internal-events
    signatureStrategy: bearer
    hmacSecretKey: AGENCY_AGENT_TOKEN

routing:
  builder-dispatch:
    rules:
      # Engineering-pipeline requests (from Winston via submit_engineering_request,
      # or from daily-healthcheck detectors via the same tool) carry an issue URL
      # in replyContext. Triage reads the spec from the issue, decomposes into
      # surface work items, dispatches each.
      - name: triage
        condition:
          all_of: []
        messageTemplate: templates/triage.md
        tools:
          - module.python: agency_tools.clawndom.fire_builder_callback
          # SPE-Builder-visibility — triage uses search_prs at Step 0 to
          # check "have I already shipped a PR for this exception?"
          # Querying GitHub directly avoids a parallel memory store and
          # keeps the source of truth at the source.
          - module.python: agency_tools.github.search_prs

  builder-internal-events:
    rules:
      - name: workspace-task
        condition:
          equals:
            field: kind
            value: workspace_task
        messageTemplate: templates/workspace-task.md
        tools:
          - module.python: agency_tools.clawndom.fire_builder_callback

      - name: tool-task
        condition:
          equals:
            field: kind
            value: tool_task
        messageTemplate: templates/tool-task.md
        tools:
          - module.python: agency_tools.clawndom.fire_builder_callback

      - name: runtime-task
        condition:
          equals:
            field: kind
            value: runtime_task
        messageTemplate: templates/runtime-task.md
        tools:
          - module.python: agency_tools.clawndom.fire_builder_callback

runner:
  type: claude-cli
  model: claude-opus-4-7
